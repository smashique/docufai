<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docufai Pro - Elite AI Document Architect</title>
    
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <link rel="apple-touch-icon" href="/icon.svg">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/html-docx-js/dist/html-docx.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/file-saver/dist/FileSaver.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Hind+Siliguri:wght@400;700&display=swap');
        
        body { font-family: 'Inter', 'Hind Siliguri', sans-serif; scroll-behavior: smooth; }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.3); }
        .progress-line { height: 4px; width: 0%; background: linear-gradient(to right, #6366f1, #a855f7); transition: width 0.4s ease; }
        .pulse-btn { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(99, 102, 241, 0); } 100% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0); } }
        .page-thumb.active { border: 4px solid #6366f1; transform: scale(0.95); box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.3); }
        #outputFrame { border-radius: 0 0 1.5rem 1.5rem; transition: all 0.5s ease; background: white; }
    </style>
</head>
<body class="bg-[#f8fafc] text-slate-900 overflow-x-hidden">

    <div class="fixed top-0 left-0 w-full z-[100]"><div id="topProgress" class="progress-line"></div></div>

    <nav class="glass sticky top-0 z-50 px-6 py-4 flex justify-between items-center shadow-sm">
        <div class="flex items-center space-x-3">
            <div class="w-11 h-11 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-black shadow-xl text-xl rotate-3">D</div>
            <span class="text-2xl font-black tracking-tighter text-slate-800 uppercase italic">Docufai <span class="text-indigo-600 text-[10px] lowercase font-bold block -mt-2">Professional</span></span>
        </div>
        <div class="flex items-center space-x-5">
            <div class="hidden sm:flex flex-col items-end text-right">
                <p class="text-[9px] text-slate-400 font-bold uppercase tracking-widest">Energy Balance</p>
                <p class="text-lg font-black text-indigo-600 italic leading-none"><span id="remCredits">10</span> <span class="text-[10px] text-slate-300">/ 10</span></p>
            </div>
            <button id="rechargeBtn" class="pulse-btn bg-indigo-600 text-white px-6 py-2.5 rounded-xl text-[10px] font-black uppercase tracking-wider flex items-center space-x-2">
                <span>Unlock Credits</span><span class="text-amber-400">⚡</span>
            </button>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-6 lg:p-10 grid grid-cols-1 lg:grid-cols-12 gap-10">
        <aside class="lg:col-span-4 space-y-8">
            <div class="bg-white p-8 rounded-[2.5rem] shadow-xl border border-slate-100">
                <h3 class="font-black text-slate-800 mb-6 italic tracking-tight uppercase text-xs flex items-center">
                    <span class="w-2 h-2 bg-indigo-600 rounded-full mr-2"></span> Input Source
                </h3>
                <div id="dropZone" class="border-2 border-dashed border-slate-200 rounded-[2rem] p-12 text-center cursor-pointer bg-slate-50 hover:border-indigo-400 transition-all">
                    <input type="file" id="fileInput" accept="image/*,application/pdf" class="hidden">
                    <div id="dropText" class="space-y-2">
                        <div class="w-12 h-12 bg-white rounded-xl shadow-md mx-auto flex items-center justify-center text-indigo-500">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4" stroke-width="2"></path></svg>
                        </div>
                        <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Select PDF/Image</p>
                    </div>
                </div>

                <div id="pageSelector" class="hidden mt-6 p-5 bg-indigo-50 rounded-2xl border border-indigo-100">
                    <div class="flex justify-between items-center mb-3 text-[10px] font-black text-indigo-600 uppercase">
                        <span>Select Page</span><span id="totalPagesBadge" class="bg-indigo-200 px-2 py-0.5 rounded-full">Total: <span id="totalPages">0</span></span>
                    </div>
                    <input type="number" id="targetPage" value="1" min="1" class="w-full px-4 py-2 rounded-xl border-none shadow-inner outline-none text-sm font-black">
                </div>

                <div id="previewContainer" class="hidden mt-6">
                    <p class="text-[9px] font-bold text-slate-400 uppercase mb-3 italic">Visual Preview</p>
                    <div id="previewScroll" class="flex space-x-3 overflow-x-auto pb-4 scroll-smooth"></div>
                </div>

                <button id="processBtn" class="w-full mt-8 bg-indigo-600 hover:bg-indigo-700 text-white font-black py-5 rounded-2xl shadow-2xl transition-all active:scale-95 flex items-center justify-center space-x-2">
                    <span class="uppercase tracking-widest text-xs">Architect Now</span><span>⚡</span>
                </button>
            </div>

            <div id="statusBox" class="hidden bg-white p-8 rounded-[2.5rem] border border-slate-100 shadow-xl text-center">
                <div class="w-12 h-12 border-t-4 border-indigo-600 rounded-full animate-spin mx-auto mb-4"></div>
                <p id="statusMsg" class="text-[10px] font-black text-slate-800 uppercase tracking-widest italic">Engineering...</p>
            </div>

            <div class="bg-amber-50 p-6 rounded-[2rem] border border-amber-100">
                <p class="text-xs font-black text-amber-800 uppercase mb-1">⚡ Dynamic Offer</p>
                <p class="text-lg font-black text-slate-800">৳৯৯ / ৩৩ পেজ</p>
            </div>
        </aside>

        <section class="lg:col-span-8">
            <div class="bg-slate-900 rounded-t-[2.5rem] px-8 py-4 flex items-center justify-between shadow-2xl">
                <span class="text-slate-500 text-[10px] font-mono font-bold uppercase tracking-[0.3em]">Architect Terminal v2.0</span>
                <div class="flex space-x-2">
                    <button id="copyBtn" class="hidden bg-slate-700 text-white text-[9px] font-black px-4 py-1.5 rounded-lg hover:bg-slate-600">COPY HTML</button>
                    <button id="downloadBtn" class="hidden bg-emerald-500 text-white text-[9px] font-black px-4 py-1.5 rounded-lg hover:bg-emerald-600">DOWNLOAD DOCX</button>
                </div>
            </div>
            <div class="bg-white rounded-b-[2.5rem] shadow-2xl border border-slate-100 overflow-hidden min-h-[800px] relative">
                <div id="welcomeScreen" class="absolute inset-0 flex flex-col items-center justify-center p-12 text-center">
                    <h2 class="text-2xl font-black text-slate-800 mb-2 tracking-tighter">Ready for Architecture?</h2>
                    <p class="text-slate-400 text-sm max-w-xs">Upload your file to start the magic conversion.</p>
                </div>
                <iframe id="outputFrame" class="hidden w-full h-[800px]"></iframe>
            </div>
            <p class="mt-4 text-[10px] text-slate-400 font-bold uppercase text-right">Lifetime Pages: <span id="displayCounter" class="text-indigo-600">0</span></p>
        </section>
    </main>

    <canvas id="pdfCanvas" class="hidden"></canvas>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

        // PWA Setup
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => { navigator.serviceWorker.register('/sw.js'); });
        }

        if (!localStorage.getItem('doc_user_id')) {
            localStorage.setItem('doc_user_id', 'DOC-' + Math.random().toString(36).substr(2, 6).toUpperCase());
        }

        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');
        const processBtn = document.getElementById('processBtn');
        const rechargeBtn = document.getElementById('rechargeBtn');
        const targetPageInput = document.getElementById('targetPage');
        const previewScroll = document.getElementById('previewScroll');
        const previewContainer = document.getElementById('previewContainer');
        const totalPagesSpan = document.getElementById('totalPages');
        const topProgress = document.getElementById('topProgress');
        const outFrame = document.getElementById('outputFrame');

        // Drag & Drop
        dropZone.onclick = () => fileInput.click();
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(ev => {
            dropZone.addEventListener(ev, (e) => { e.preventDefault(); e.stopPropagation(); }, false);
        });
        dropZone.addEventListener('drop', (e) => {
            if (e.dataTransfer.files.length) { fileInput.files = e.dataTransfer.files; handleFileSelect(fileInput.files[0]); }
        });
        fileInput.onchange = () => { if (fileInput.files[0]) handleFileSelect(fileInput.files[0]); };

        async function handleFileSelect(file) {
            document.getElementById('dropText').innerHTML = `<p class='text-[10px] text-indigo-600 font-black uppercase'>${file.name}</p>`;
            if (file && file.type === "application/pdf") {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
                totalPagesSpan.innerText = pdf.numPages;
                targetPageInput.max = pdf.numPages;
                document.getElementById('pageSelector').classList.remove('hidden');
                previewContainer.classList.remove('hidden');
                renderPreviews(pdf);
            } else {
                document.getElementById('pageSelector').classList.add('hidden');
                previewContainer.classList.add('hidden');
            }
        }

        async function renderPreviews(pdf) {
            previewScroll.innerHTML = '';
            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const viewport = page.getViewport({ scale: 0.3 });
                const canvas = document.createElement('canvas');
                canvas.className = `page-thumb shrink-0 border-2 border-transparent rounded-xl cursor-pointer transition-all`;
                canvas.onclick = () => { targetPageInput.value = i; document.querySelectorAll('.page-thumb').forEach(el => el.classList.remove('active')); canvas.classList.add('active'); };
                const context = canvas.getContext('2d');
                canvas.height = viewport.height; canvas.width = viewport.width;
                await page.render({ canvasContext: context, viewport: viewport }).promise;
                previewScroll.appendChild(canvas);
            }
        }

        async function getPageAsB64(file, pageNum) {
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
            const page = await pdf.getPage(pageNum);
            const canvas = document.getElementById('pdfCanvas');
            const context = canvas.getContext('2d');
            const viewport = page.getViewport({ scale: 2 });
            canvas.height = viewport.height; canvas.width = viewport.width;
            await page.render({ canvasContext: context, viewport: viewport }).promise;
            return canvas.toDataURL('image/png').split(',')[1];
        }

        // PROCESS
        processBtn.onclick = async () => {
            const file = fileInput.files[0];
            if (!file) return alert("Select a file first!");
            
            // Haptic Feedback
            if (navigator.vibrate) navigator.vibrate(50);

            document.getElementById('statusBox').classList.remove('hidden');
            topProgress.style.width = "40%";

            try {
                let b64Data = file.type === "application/pdf" ? await getPageAsB64(file, parseInt(targetPageInput.value)) : await new Promise(res => {
                    const r = new FileReader(); r.onload = () => res(r.result.split(',')[1]); r.readAsDataURL(file);
                });

                const response = await fetch("/api/engine", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ imageB64: b64Data, userInfo: { id: localStorage.getItem('doc_user_id') } })
                });

                const data = await response.json();

                if (!response.ok || !data.choices) {
                    if (response.status === 402) { rechargeBtn.classList.remove('hidden'); alert("Credits exhausted!"); }
                    else alert("Error: " + (data.error || "API Failed"));
                    resetUI(); return;
                }

                // Haptic Success
                if (navigator.vibrate) navigator.vibrate([50, 100, 50]);
                topProgress.style.width = "100%";

                let aiContent = data.choices[0].message.content.replace(/```html|```/g, "").trim();

                // Build Final MS Word XML Structure
                let headerContent = "", footerContent = "", bodyContent = aiContent;
                const hMatch = aiContent.match(/<header>(.*?)<\/header>/s);
                if (hMatch) { headerContent = hMatch[1]; bodyContent = bodyContent.replace(hMatch[0], ""); }
                const fMatch = aiContent.match(/<footer>(.*?)<\/footer>/s);
                if (fMatch) { footerContent = fMatch[1]; bodyContent = bodyContent.replace(fMatch[0], ""); }

                const wordHTML = `
                    <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
                    <head><meta charset="utf-8">
                        <script>window.MathJax = { tex: { inlineMath: [['$', '$']] } };<\/script>
                        <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async><\/script>
                        <style>
                            @page { size: 21cm 29.7cm; margin: 1.27cm; mso-header: url("h1") h1; mso-footer: url("f1") f1; }
                            body { font-family: 'Times New Roman', serif; font-size: 10.5pt; line-height: 1.15; padding: 20px; }
                            table { border-collapse: collapse; width: 100%; border: 1px solid #000; }
                            td { border: 1px solid #000; padding: 5pt; vertical-align: top; }
                            div#h1 { font-size: 9pt; text-align: center; border-bottom: 1px solid #ddd; }
                            div#f1 { font-size: 9pt; text-align: center; border-top: 1px solid #ddd; }
                        </style>
                    </head>
                    <body>
                        <div style='mso-element:header' id=h1>${headerContent || '<p>Docufai Pro Architecture</p>'}</div>
                        <div id="editable-body">${bodyContent}</div>
                        <div style='mso-element:footer' id=f1>${footerContent || '<p>Page <span style="mso-field-code: PAGE "></span> of <span style="mso-field-code: NUMPAGES "></span></p>'}</div>
                    </body></html>
                `;

                document.getElementById('welcomeScreen').classList.add('hidden');
                outFrame.classList.remove('hidden');
                outFrame.srcdoc = wordHTML;

                // Live Editor Enable
                outFrame.onload = () => {
                    outFrame.contentDocument.body.contentEditable = 'true';
                    outFrame.contentDocument.body.style.outline = 'none';
                };

                document.getElementById('remCredits').innerText = data.total_credits - data.updated_count;
                document.getElementById('displayCounter').innerText = data.updated_count;
                document.getElementById('downloadBtn').classList.remove('hidden');
                document.getElementById('copyBtn').classList.remove('hidden');
                resetUI();

            } catch (err) { alert(err.message); resetUI(); }
        };

        function resetUI() {
            document.getElementById('statusBox').classList.add('hidden');
            setTimeout(() => topProgress.style.width = "0%", 1000);
        }

        rechargeBtn.onclick = () => window.location.href = "/api/pay?userId=" + localStorage.getItem('doc_user_id');
        
        document.getElementById('copyBtn').onclick = () => {
            const content = outFrame.contentDocument.body.innerHTML;
            navigator.clipboard.writeText(content);
            alert("HTML Copied to Clipboard!");
        };

        document.getElementById('downloadBtn').onclick = function() {
            const content = outFrame.contentDocument.documentElement.outerHTML;
            const blob = new Blob(['\ufeff', content], { type: 'application/msword' });
            saveAs(blob, 'Docufai_Pro_Export.doc');
        };
    </script>
</body>
</html>
