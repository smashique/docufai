<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docufai Pro - Elite AI Document Architect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/file-saver/dist/FileSaver.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Hind+Siliguri:wght@400;700&display=swap');
        body { font-family: 'Inter', 'Hind Siliguri', sans-serif; scroll-behavior: smooth; }
        .progress-line { height: 4px; width: 0%; background: linear-gradient(to right, #6366f1, #a855f7); transition: width 0.4s ease; }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .pulse-btn { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(99, 102, 241, 0); } 100% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0); } }
        .page-thumb.active { border: 4px solid #6366f1; transform: scale(0.95); box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.3); }
    </style>
</head>
<body class="bg-[#f8fafc] text-slate-900">
    <div class="fixed top-0 left-0 w-full z-[100]"><div id="topProgress" class="progress-line"></div></div>

    <nav class="glass sticky top-0 z-50 px-8 py-4 flex justify-between items-center shadow-sm">
        <div class="flex items-center space-x-3">
            <div class="w-11 h-11 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-black shadow-xl text-xl rotate-3">D</div>
            <span class="text-2xl font-black text-slate-800 uppercase italic">Docufai <span class="text-indigo-600 text-[10px] block -mt-2">Professional</span></span>
        </div>
        <div class="flex items-center space-x-4">
            <p id="remCredits" class="text-lg font-black text-indigo-600 italic">10</p>
            <button id="rechargeBtn" class="pulse-btn bg-indigo-600 text-white px-6 py-2 rounded-xl text-[10px] font-black uppercase">Recharge ⚡</button>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
        <aside class="lg:col-span-4 space-y-6">
            <div class="bg-white p-8 rounded-[2.5rem] shadow-xl border border-slate-100">
                <div id="dropZone" class="border-2 border-dashed border-slate-200 rounded-[1.5rem] p-10 text-center cursor-pointer hover:border-indigo-400 bg-slate-50 transition-all">
                    <input type="file" id="fileInput" accept="image/*,application/pdf" class="hidden">
                    <p id="dropText" class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Select PDF or Image</p>
                </div>
                <div id="previewScroll" class="hidden mt-4 overflow-x-auto flex space-x-2 pb-2"></div>
                
                <div id="pageSelector" class="hidden mt-4 p-4 bg-indigo-50 rounded-xl border border-indigo-100">
                    <label class="text-[9px] font-black uppercase text-indigo-400 block mb-1">Target Page</label>
                    <input type="number" id="targetPage" value="1" min="1" class="w-full bg-transparent font-black outline-none text-indigo-700">
                </div>

                <button id="processBtn" class="w-full mt-6 bg-indigo-600 text-white font-black py-4 rounded-xl shadow-xl active:scale-95 transition-all">ARCHITECT NOW ⚡</button>
            </div>
            <div id="statusBox" class="hidden bg-white p-8 rounded-[2rem] text-center shadow-md">
                <div class="w-8 h-8 border-t-2 border-indigo-600 rounded-full animate-spin mx-auto mb-2"></div>
                <p class="text-[10px] font-black uppercase italic tracking-widest">Engineering Replica...</p>
            </div>
        </aside>

        <section class="lg:col-span-8">
            <div class="bg-slate-900 rounded-t-[2rem] px-8 py-5 flex items-center justify-between">
                <span class="text-slate-500 text-[9px] font-mono font-bold tracking-widest uppercase italic">Architect Terminal v2.0</span>
                <div class="flex space-x-2">
                    <button id="copyBtn" class="hidden bg-slate-700 text-white text-[9px] font-black px-4 py-2 rounded-lg">COPY HTML</button>
                    <button id="downloadBtn" class="hidden bg-emerald-500 text-white text-[9px] font-black px-5 py-2 rounded-lg shadow-lg">DOWNLOAD DOCX</button>
                </div>
            </div>
            <div class="bg-white rounded-b-[2rem] shadow-2xl border border-slate-100 min-h-[750px] relative overflow-hidden">
                <div id="welcomeScreen" class="absolute inset-0 flex flex-col items-center justify-center p-12 text-center">
                    <h2 class="text-2xl font-black text-slate-800 mb-2">Ready for Architecture?</h2>
                    <p class="text-slate-400 text-sm">Upload a page to start the high-fidelity DNA reconstruction.</p>
                </div>
                <iframe id="outputFrame" class="hidden w-full h-[750px] border-none"></iframe>
            </div>
            <p class="mt-4 text-[10px] text-slate-400 font-bold uppercase text-right px-4">Lifetime Pages: <span id="displayCounter" class="text-indigo-600">0</span></p>
        </section>
    </main>

    <canvas id="pdfCanvas" class="hidden"></canvas>

    <script type="module">
        // Root-এ রাখা formats.js থেকে ইম্পোর্ট করা হচ্ছে
        import { sharpenForAI, getEliteWordTemplate } from './formats.js';

        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

        const state = { userId: localStorage.getItem('doc_user_id') || 'DOC-' + Math.random().toString(36).substr(2, 6).toUpperCase() };
        localStorage.setItem('doc_user_id', state.userId);

        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');
        const processBtn = document.getElementById('processBtn');
        const rechargeBtn = document.getElementById('rechargeBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const copyBtn = document.getElementById('copyBtn');
        const outFrame = document.getElementById('outputFrame');
        const topProgress = document.getElementById('topProgress');

        // ১. বাটন অ্যাক্টিভেশন (Explicit Listener)
        rechargeBtn.addEventListener('click', () => {
            if (navigator.vibrate) navigator.vibrate(50);
            window.location.href = `/api/pay?userId=${state.userId}`;
        });

        dropZone.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', async () => {
            if (fileInput.files[0]) {
                const file = fileInput.files[0];
                document.getElementById('dropText').innerText = file.name;
                if (file.type === "application/pdf") {
                    const pdf = await pdfjsLib.getDocument(await file.arrayBuffer()).promise;
                    document.getElementById('totalPages').innerText = pdf.numPages;
                    document.getElementById('pageSelector').classList.remove('hidden');
                    renderPreviews(pdf);
                }
            }
        });

        async function renderPreviews(pdf) {
            const scroll = document.getElementById('previewScroll');
            scroll.innerHTML = ''; scroll.classList.remove('hidden');
            for (let i = 1; i <= Math.min(pdf.numPages, 10); i++) {
                const page = await pdf.getPage(i);
                const canvas = document.createElement('canvas');
                canvas.className = `page-thumb shrink-0 border-2 border-transparent rounded-xl cursor-pointer w-20`;
                const viewport = page.getViewport({ scale: 0.2 });
                canvas.width = viewport.width; canvas.height = viewport.width * 1.4;
                await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
                canvas.onclick = () => {
                    document.getElementById('targetPage').value = i;
                    document.querySelectorAll('.page-thumb').forEach(el => el.classList.remove('active'));
                    canvas.classList.add('active');
                };
                scroll.appendChild(canvas);
            }
        }

        // ২. মেইন প্রসেসিং লজিক (Simulation Checked)
        processBtn.addEventListener('click', async () => {
            const file = fileInput.files[0];
            if (!file) return alert("Select file first!");
            if (navigator.vibrate) navigator.vibrate(50);

            document.getElementById('statusBox').classList.remove('hidden');
            topProgress.style.width = "40%";

            try {
                const canvas = document.getElementById('pdfCanvas');
                let b64Data;
                
                if (file.type === "application/pdf") {
                    const pdf = await pdfjsLib.getDocument(await file.arrayBuffer()).promise;
                    const page = await pdf.getPage(parseInt(document.getElementById('targetPage').value) || 1);
                    const viewport = page.getViewport({ scale: 2 });
                    canvas.width = viewport.width; canvas.height = viewport.height;
                    await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
                } else {
                    const img = new Image(); img.src = URL.createObjectURL(file);
                    await new Promise(r => img.onload = r);
                    canvas.width = img.width; canvas.height = img.height;
                    canvas.getContext('2d').drawImage(img, 0, 0);
                }

                sharpenForAI(canvas); // ইমেজ শার্পনার কল (Root-এর formats.js থেকে)
                b64Data = canvas.toDataURL('image/png').split(',')[1];

                const response = await fetch("/api/engine", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ imageB64: b64Data, userInfo: { id: state.userId } })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error);

                let aiContent = data.choices[0].message.content.replace(/```html|```/g, "").trim();
                document.getElementById('welcomeScreen').classList.add('hidden');
                outFrame.classList.remove('hidden');
                
                // ফর্মেটিং ইঞ্জিন কল (Root-এর formats.js থেকে)
                outFrame.srcdoc = getEliteWordTemplate(aiContent);

                outFrame.onload = () => {
                    outFrame.contentDocument.body.contentEditable = 'true';
                };

                document.getElementById('remCredits').innerText = data.total_credits - data.updated_count;
                document.getElementById('displayCounter').innerText = data.updated_count;
                downloadBtn.classList.remove('hidden');
                copyBtn.classList.remove('hidden');
                topProgress.style.width = "100%";
                document.getElementById('statusBox').classList.add('hidden');

            } catch (err) { alert(err.message); document.getElementById('statusBox').classList.add('hidden'); }
        });

        copyBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(outFrame.contentDocument.body.innerHTML);
            alert("HTML Copied!");
        });

        downloadBtn.addEventListener('click', () => {
            const blob = new Blob(['\ufeff', outFrame.contentDocument.documentElement.outerHTML], { type: 'application/msword' });
            saveAs(blob, 'Docufai_Pro_Export.doc');
        });
    </script>
</body>
</html>
