<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docufai Pro - Elite AI Document Architect</title>
    <link rel="manifest" href="/manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/file-saver/dist/FileSaver.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Hind+Siliguri:wght@400;700&display=swap');
        body { font-family: 'Inter', 'Hind Siliguri', sans-serif; }
        .progress-line { height: 4px; width: 0%; background: linear-gradient(to right, #6366f1, #a855f7); transition: width 0.4s ease; }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.3); }
        .page-thumb.active { border: 4px solid #6366f1; transform: scale(0.95); box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.3); }
    </style>
</head>
<body class="bg-[#f8fafc] overflow-x-hidden">
    <div class="fixed top-0 left-0 w-full z-[100]"><div id="topProgress" class="progress-line"></div></div>

    <nav class="glass sticky top-0 z-50 px-8 py-4 flex justify-between items-center shadow-sm">
        <div class="flex items-center space-x-3">
            <div class="w-11 h-11 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-black shadow-xl text-xl rotate-3">D</div>
            <span class="text-2xl font-black text-slate-800 uppercase italic tracking-tighter">Docufai <span class="text-indigo-600 text-[10px] lowercase block -mt-2">Pro</span></span>
        </div>
        <div class="flex items-center space-x-4">
            <div class="text-right"><p id="remCredits" class="text-lg font-black text-indigo-600 italic leading-none">10</p></div>
            <button id="rechargeBtn" class="bg-indigo-600 text-white px-6 py-2.5 rounded-xl text-[10px] font-black uppercase tracking-wider shadow-lg hover:scale-95 transition-all">Recharge ⚡</button>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
        <aside class="lg:col-span-4 space-y-8">
            <div class="bg-white p-8 rounded-[2.5rem] shadow-xl border border-slate-100">
                <h3 class="font-black text-slate-800 mb-6 uppercase text-xs italic tracking-widest"><span class="w-2 h-2 bg-indigo-600 rounded-full mr-2 inline-block"></span> Input Source</h3>
                <div id="dropZone" class="border-2 border-dashed border-slate-200 rounded-[2rem] p-12 text-center cursor-pointer bg-slate-50 hover:border-indigo-400 transition-all">
                    <input type="file" id="fileInput" accept="image/*,application/pdf" class="hidden">
                    <div id="dropText"><p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Select PDF/Image</p></div>
                </div>
                <div id="pageSelector" class="hidden mt-6 p-5 bg-indigo-50 rounded-2xl border border-indigo-100">
                    <input type="number" id="targetPage" value="1" min="1" class="w-full px-4 py-2 rounded-xl outline-none text-sm font-black">
                </div>
                <div id="previewContainer" class="hidden mt-6 flex space-x-3 overflow-x-auto pb-4 scroll-smooth" id="previewScroll"></div>
                <button id="processBtn" class="w-full mt-8 bg-indigo-600 text-white font-black py-5 rounded-2xl shadow-2xl hover:bg-indigo-700 transition-all">ARCHITECT NOW ⚡</button>
            </div>
            <div id="statusBox" class="hidden bg-white p-8 rounded-[2.5rem] border border-slate-100 shadow-xl text-center">
                <div class="w-10 h-10 border-t-4 border-indigo-600 rounded-full animate-spin mx-auto mb-4"></div>
                <p class="text-[10px] font-black text-slate-800 uppercase tracking-widest italic">Engineering Layout...</p>
            </div>
        </aside>

        <section class="lg:col-span-8">
            <div class="bg-slate-900 rounded-t-[2.5rem] px-8 py-5 flex items-center justify-between border-b border-slate-800 shadow-2xl">
                <span class="text-slate-500 text-[10px] font-mono font-bold tracking-[0.3em]">Architect Terminal v2.0</span>
                <div class="flex space-x-2">
                    <button id="copyBtn" class="hidden bg-slate-700 text-white text-[9px] font-black px-4 py-2 rounded-lg hover:bg-slate-600">COPY HTML</button>
                    <button id="downloadBtn" class="hidden bg-emerald-500 text-white text-[9px] font-black px-4 py-2 rounded-lg hover:bg-emerald-600 transition-all">DOWNLOAD DOCX</button>
                </div>
            </div>
            <div class="bg-white rounded-b-[2.5rem] shadow-2xl border border-slate-100 overflow-hidden min-h-[750px] relative">
                <div id="welcomeScreen" class="absolute inset-0 flex flex-col items-center justify-center p-12 text-center">
                    <h2 class="text-2xl font-black text-slate-800 mb-2 tracking-tighter">Ready for Architecture?</h2>
                    <p class="text-slate-400 text-sm max-w-xs">Upload your file and let the Elite DNA Decoder build the replica.</p>
                </div>
                <iframe id="outputFrame" class="hidden w-full h-[750px]"></iframe>
            </div>
        </section>
    </main>

    <canvas id="pdfCanvas" class="hidden"></canvas>

    <script type="module">
        // মডুলার ইম্পোর্ট
        import { sharpenForAI, getEliteWordTemplate } from './api/formats.js';

        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
        const state = { userId: localStorage.getItem('doc_user_id') || 'DOC-' + Math.random().toString(36).substr(2, 6).toUpperCase() };
        localStorage.setItem('doc_user_id', state.userId);

        const fileInput = document.getElementById('fileInput');
        const outFrame = document.getElementById('outputFrame');
        const topProgress = document.getElementById('topProgress');

        // ফাইল হ্যান্ডলিং
        dropZone.onclick = () => fileInput.click();
        fileInput.onchange = () => { if (fileInput.files[0]) handleFileSelect(fileInput.files[0]); };

        async function handleFileSelect(file) {
            document.getElementById('dropText').innerHTML = `<p class='text-[10px] text-indigo-600 font-black uppercase'>${file.name}</p>`;
            if (file && file.type === "application/pdf") {
                const pdf = await pdfjsLib.getDocument(await file.arrayBuffer()).promise;
                document.getElementById('totalPages').innerText = pdf.numPages;
                document.getElementById('pageSelector').classList.remove('hidden');
                renderPreviews(pdf);
            }
        }

        async function renderPreviews(pdf) {
            const container = document.getElementById('previewContainer');
            container.innerHTML = ''; container.classList.remove('hidden');
            for (let i = 1; i <= Math.min(pdf.numPages, 10); i++) {
                const page = await pdf.getPage(i);
                const canvas = document.createElement('canvas');
                canvas.className = `page-thumb shrink-0 border-2 border-transparent rounded-xl cursor-pointer w-20`;
                const viewport = page.getViewport({ scale: 0.2 });
                canvas.width = viewport.width; canvas.height = viewport.height;
                await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
                canvas.onclick = () => { document.getElementById('targetPage').value = i; };
                container.appendChild(canvas);
            }
        }

        // এআই প্রসেসিং
        processBtn.onclick = async () => {
            const file = fileInput.files[0];
            if (!file) return alert("Select file!");
            if (navigator.vibrate) navigator.vibrate(50); // হ্যাপটিক

            document.getElementById('statusBox').classList.remove('hidden');
            topProgress.style.width = "40%";

            try {
                const canvas = document.getElementById('pdfCanvas');
                let b64Data;
                
                // ইমেজ শার্পনিং লজিক (AI-এর কাজ কমাতে)
                if (file.type === "application/pdf") {
                    const pdf = await pdfjsLib.getDocument(await file.arrayBuffer()).promise;
                    const page = await pdf.getPage(parseInt(targetPageInput.value) || 1);
                    const viewport = page.getViewport({ scale: 2 });
                    canvas.width = viewport.width; canvas.height = viewport.height;
                    await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
                    sharpenForAI(canvas); // শার্পেনার কল
                    b64Data = canvas.toDataURL('image/png').split(',')[1];
                } else {
                    const img = new Image(); img.src = URL.createObjectURL(file);
                    await new Promise(r => img.onload = r);
                    canvas.width = img.width; canvas.height = img.height;
                    canvas.getContext('2d').drawImage(img, 0, 0);
                    sharpenForAI(canvas); // শার্পেনার কল
                    b64Data = canvas.toDataURL('image/png').split(',')[1];
                }

                const response = await fetch("/api/engine", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ imageB64: b64Data, userInfo: { id: state.userId } })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error);

                // রেপ্লিকা রেন্ডারিং
                let aiContent = data.choices[0].message.content.replace(/```html|```/g, "").trim();
                document.getElementById('welcomeScreen').classList.add('hidden');
                outFrame.classList.remove('hidden');
                outFrame.srcdoc = getEliteWordTemplate(aiContent);

                // লাইভ এডিটর
                outFrame.onload = () => { outFrame.contentDocument.body.contentEditable = 'true'; };

                document.getElementById('remCredits').innerText = data.total_credits - data.updated_count;
                document.getElementById('downloadBtn').classList.remove('hidden');
                document.getElementById('copyBtn').classList.remove('hidden');
                topProgress.style.width = "100%";
                document.getElementById('statusBox').classList.add('hidden');
                if (navigator.vibrate) navigator.vibrate([50, 100, 50]);

            } catch (err) { alert(err.message); resetUI(); }
        };

        function resetUI() { document.getElementById('statusBox').classList.add('hidden'); topProgress.style.width = "0%"; }
        
        copyBtn.onclick = () => { navigator.clipboard.writeText(outFrame.contentDocument.body.innerHTML); alert("HTML Copied!"); };
        downloadBtn.onclick = () => {
            const blob = new Blob(['\ufeff', outFrame.contentDocument.documentElement.outerHTML], { type: 'application/msword' });
            saveAs(blob, 'Docufai_Pro_Export.doc');
        };
        rechargeBtn.onclick = () => window.location.href = "/api/pay?userId=" + state.userId;
    </script>
</body>
</html>
