<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docufai Pro - Elite AI Architect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/file-saver/dist/FileSaver.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .progress-line { height: 4px; width: 0%; background: #6366f1; transition: width 0.4s; position: fixed; top: 0; left: 0; z-index: 100; }
        .page-thumb.active { border: 3px solid #6366f1; transform: scale(0.95); }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">

    <div id="incognitoAlert" class="hidden fixed inset-0 bg-slate-900/95 z-[9999] flex items-center justify-center p-6 backdrop-blur-md">
        <div class="bg-white rounded-3xl p-10 max-w-md w-full text-center shadow-2xl">
            <h2 class="text-2xl font-black mb-4 uppercase">Incognito Blocked</h2>
            <p class="mb-8 font-bold text-slate-500">Normal mode required to sync your credits.</p>
            <button onclick="window.location.reload()" class="w-full bg-indigo-600 text-white font-black py-4 rounded-2xl">RELOAD SITE ⚡</button>
        </div>
    </div>

    <div id="topProgress" class="progress-line"></div>
    
    <nav class="bg-white/80 backdrop-blur-md sticky top-0 z-50 p-3 md:p-4 flex justify-between items-center shadow-sm">
        <div class="font-black italic text-lg md:text-xl shrink-0">DOCUFAI <span class="text-indigo-600 text-[8px] uppercase block">Pro</span></div>
        <div class="flex items-center space-x-3 md:space-x-6">
            <div class="flex flex-col items-end shrink-0">
                <span id="displayUserId" class="font-black text-indigo-600 text-lg md:text-2xl leading-none"></span>
                <span class="text-[7px] md:text-[9px] uppercase font-bold text-slate-400">User ID</span>
            </div>
            <div class="flex items-center space-x-2 md:space-x-3">
                <span id="remCredits" class="font-black text-slate-800 text-lg md:text-xl">10</span>
                <button id="rechargeBtn" class="bg-indigo-600 text-white px-3 md:px-4 py-1.5 md:py-2 rounded-xl text-[8px] md:text-[10px] font-black uppercase shadow-lg">Recharge ⚡</button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-8">
        <aside class="lg:col-span-4 space-y-6">
            <div class="bg-white p-6 rounded-3xl shadow-xl border border-slate-100">
                <div id="dropZone" class="border-2 border-dashed border-slate-200 rounded-2xl p-10 text-center cursor-pointer hover:border-indigo-400 bg-slate-50">
                    <input type="file" id="fileInput" class="hidden" accept="image/*,application/pdf">
                    <p class="text-[10px] font-black uppercase text-slate-400">Upload Math MCQ</p>
                </div>
                <div id="pdfControls" class="hidden mt-6 overflow-x-auto flex space-x-3 pb-2"></div>
                <button id="processBtn" class="w-full mt-6 bg-indigo-600 text-white font-black py-4 rounded-2xl shadow-lg">ARCHITECT NOW ⚡</button>
            </div>
            <div id="statusBox" class="hidden bg-white p-6 rounded-2xl text-center shadow-md">
                <div class="w-6 h-6 border-t-2 border-indigo-600 rounded-full animate-spin mx-auto mb-2"></div>
                <p class="text-[10px] font-black uppercase italic text-slate-600">Reconstructing Math Columns...</p>
            </div>
        </aside>

        <section class="lg:col-span-8">
            <div class="bg-slate-900 rounded-t-2xl px-6 py-4 flex justify-between items-center">
                <span class="text-slate-500 text-[9px] font-mono tracking-widest uppercase italic">DNA Terminal v2.0</span>
                <div class="flex space-x-2">
                    <button id="copyBtn" class="hidden bg-slate-700 text-white text-[9px] px-3 py-1.5 rounded-lg">COPY</button>
                    <button id="downloadBtn" class="hidden bg-emerald-600 text-white text-[9px] px-3 py-1.5 rounded-lg font-bold">DOCX</button>
                </div>
            </div>
            <div class="bg-white rounded-b-2xl border min-h-[750px] overflow-hidden relative shadow-2xl">
                <iframe id="outputFrame" class="hidden w-full h-[750px] border-none"></iframe>
            </div>
        </section>
    </main>

    <script type="module">
        import { sharpenForAI, getEliteWordTemplate } from './formats.js';
        const state = { userId: localStorage.getItem('doc_user_id') || 'DOC-' + Math.random().toString(36).substr(2, 6).toUpperCase() };
        localStorage.setItem('doc_user_id', state.userId);
        document.getElementById('displayUserId').innerText = state.userId;

        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');
        const outFrame = document.getElementById('outputFrame');

        dropZone.onclick = () => fileInput.click();

        document.getElementById('processBtn').onclick = async () => {
            const file = fileInput.files[0];
            if (!file) return alert("Select file first!");
            document.getElementById('statusBox').classList.remove('hidden');
            
            try {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const img = new Image(); img.src = URL.createObjectURL(file);
                await new Promise(r => img.onload = r);
                canvas.width = img.width; canvas.height = img.height;
                ctx.drawImage(img, 0, 0);
                sharpenForAI(canvas);
                
                const res = await fetch("/api/engine", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ imageB64: canvas.toDataURL('image/jpeg', 0.7).split(',')[1], userInfo: { id: state.userId } })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.error || "AI Error");
                
                document.getElementById('remCredits').innerText = data.total_credits - data.updated_count;
                outFrame.classList.remove('hidden');
                outFrame.srcdoc = getEliteWordTemplate(data.choices[0].message.content.replace(/```html|```/g, "").trim());
                document.getElementById('downloadBtn').classList.remove('hidden');
                document.getElementById('copyBtn').classList.remove('hidden');
                document.getElementById('statusBox').classList.add('hidden');
            } catch (err) { alert(err.message); document.getElementById('statusBox').classList.add('hidden'); }
        };

        document.getElementById('copyBtn').onclick = () => { navigator.clipboard.writeText(outFrame.contentDocument.body.innerHTML); alert("Copied!"); };
        document.getElementById('downloadBtn').onclick = () => {
            const blob = new Blob(['\ufeff', outFrame.contentDocument.documentElement.outerHTML], { type: 'application/msword' });
            saveAs(blob, 'Math_Exam_Export.doc');
        };
    </script>
</body>
</html>
