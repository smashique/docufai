<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docufai - Professional AI Document Architect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/html-docx-js/dist/html-docx.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/file-saver/dist/FileSaver.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap');
        body { font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .spinner { border-top-color: #6366f1; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #outputFrame { width: 100%; height: 800px; border: none; background: #fff; }
        .drag-active { border-color: #6366f1 !important; background-color: #f5f3ff !important; transform: scale(1.01); }
        .drop-zone { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); border-width: 2px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">

    <nav class="bg-white border-b border-slate-200 px-8 py-4 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center space-x-2">
            <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-black shadow-lg text-xl">D</div>
            <span class="text-2xl font-black tracking-tighter text-slate-800 uppercase italic">Docufai <span class="text-indigo-600 text-[10px] lowercase font-bold tracking-[0.2em]">v1.0 Pro</span></span>
        </div>
        <div class="flex items-center space-x-6">
            <div class="text-right">
                <p class="text-[9px] text-slate-400 font-bold uppercase tracking-widest">User Identity</p>
                <p id="displayUserID" class="text-xs font-black text-indigo-600 tracking-tighter italic uppercase"></p>
            </div>
            <div class="h-8 w-[1px] bg-slate-200"></div>
            <div class="text-right">
                <p class="text-[9px] text-slate-400 font-bold uppercase tracking-widest">Lifetime Usage</p>
                <p class="text-xs font-black text-slate-800 tracking-tighter"><span id="displayCounter">0</span> Pages</p>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-6 lg:p-10 grid grid-cols-1 lg:grid-cols-4 gap-8">
        <aside class="lg:col-span-1 space-y-6">
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                <h3 class="font-extrabold text-slate-800 mb-5 flex items-center italic tracking-tight uppercase text-xs">📁 Secure Upload</h3>
                
                <div id="dropZone" class="drop-zone border-2 border-dashed border-slate-300 rounded-2xl p-10 text-center cursor-pointer bg-slate-50 hover:border-indigo-500 relative">
                    <input type="file" id="fileInput" accept="image/*,application/pdf" class="hidden">
                    <div class="pointer-events-none space-y-3">
                        <div class="text-4xl text-slate-300">📄</div>
                        <p class="text-[10px] text-slate-600 font-bold uppercase tracking-widest">Select Image/PDF</p>
                    </div>
                </div>

                <div id="pageSelector" class="hidden mt-6 p-4 bg-indigo-50 rounded-2xl border border-indigo-100">
                    <label class="block text-[10px] font-bold text-indigo-600 uppercase mb-2">Target Page Number</label>
                    <input type="number" id="targetPage" value="1" min="1" class="w-full px-4 py-2 rounded-xl border border-indigo-200 focus:ring-2 focus:ring-indigo-500 outline-none text-sm font-bold">
                    <p id="totalPageHint" class="text-[9px] text-indigo-400 mt-2 italic"></p>
                </div>

                <div id="fileList" class="mt-4 space-y-2"></div>

                <button id="processBtn" class="w-full mt-8 bg-indigo-600 hover:bg-indigo-700 text-white font-black py-4 rounded-xl shadow-xl transition-all flex items-center justify-center space-x-2 active:scale-95 group">
                    <span>CONVERT PAGE</span>⚡
                </button>
            </div>

            <div id="statusBox" class="hidden bg-white p-6 rounded-3xl border border-slate-200 shadow-sm text-center">
                <div class="spinner w-10 h-10 border-4 border-slate-200 mx-auto mb-4 rounded-full"></div>
                <p id="statusMsg" class="text-[10px] font-black text-slate-600 tracking-[0.2em] uppercase italic">Contacting Engine...</p>
            </div>
        </aside>

        <section class="lg:col-span-3">
            <div class="bg-slate-900 rounded-t-[2rem] px-6 py-4 flex items-center justify-between border-b border-slate-700">
                <div class="flex items-center space-x-2">
                    <div class="w-3 h-3 rounded-full bg-rose-500"></div>
                    <div class="w-3 h-3 rounded-full bg-amber-500"></div>
                    <div class="w-3 h-3 rounded-full bg-emerald-500"></div>
                    <span class="text-slate-400 text-[10px] font-mono font-bold uppercase ml-4 tracking-[0.3em]">Architect Terminal Console</span>
                </div>
                <button id="downloadBtn" class="hidden bg-emerald-600 hover:bg-emerald-700 text-white text-[10px] font-bold px-4 py-1.5 rounded-lg shadow-lg active:scale-95 transition-all uppercase">Download Docx</button>
            </div>
            <div class="bg-white rounded-b-[2rem] shadow-2xl border border-slate-200 overflow-hidden min-h-[800px]">
                <iframe id="outputFrame" srcdoc="<body style='font-family:sans-serif; color:#94a3b8; display:flex; flex-direction:column; justify-content:center; align-items:center; height:100vh; margin:0;'><div>আউটপুট এখানে রেন্ডার হবে...</div></body>"></iframe>
            </div>
        </section>
    </main>

    <canvas id="pdfCanvas" class="hidden"></canvas>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

        // --- Core ID & Analytics ---
        if (!localStorage.getItem('arch_user_id')) {
            localStorage.setItem('arch_user_id', 'DOC-' + Math.random().toString(36).substr(2, 6).toUpperCase());
            localStorage.setItem('arch_page_counter', 0);
        }
        document.getElementById('displayUserID').innerText = localStorage.getItem('arch_user_id');
        document.getElementById('displayCounter').innerText = localStorage.getItem('arch_page_counter');

        // --- Incognito Detection ---
        async function checkIncognito() {
            if ('storage' in navigator && 'estimate' in navigator.storage) {
                const { quota } = await navigator.storage.estimate();
                if (quota < 120000000) return true;
            }
            return false;
        }

        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');
        const fileList = document.getElementById('fileList');
        const processBtn = document.getElementById('processBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const pageSelector = document.getElementById('pageSelector');
        const targetPageInput = document.getElementById('targetPage');
        const statusBox = document.getElementById('statusBox');
        const statusMsg = document.getElementById('statusMsg');

        dropZone.onclick = () => fileInput.click();

        fileInput.onchange = async () => {
            const file = fileInput.files[0];
            if (!file) return;
            fileList.innerHTML = `<div class='text-[10px] bg-indigo-50 text-indigo-700 px-3 py-2 rounded-xl border border-indigo-100 truncate shadow-sm font-bold'>📄 ${file.name}</div>`;
            if (file.type === "application/pdf") {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
                document.getElementById('totalPageHint').innerText = `Total: ${pdf.numPages} Pages Available`;
                pageSelector.classList.remove('hidden');
                targetPageInput.max = pdf.numPages;
            } else { pageSelector.classList.add('hidden'); }
        };

        // PDF Page Extractor
        async function getPageAsB64(file, pageNum) {
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
            const page = await pdf.getPage(pageNum);
            const canvas = document.getElementById('pdfCanvas');
            const context = canvas.getContext('2d');
            const viewport = page.getViewport({ scale: 2 });
            canvas.height = viewport.height; canvas.width = viewport.width;
            await page.render({ canvasContext: context, viewport: viewport }).promise;
            return canvas.toDataURL('image/png').split(',')[1];
        }

        // Processing Logic
        processBtn.onclick = async () => {
            const file = fileInput.files[0];
            if (!file) return alert("দয়া করে ফাইল সিলেক্ট করুন!");

            const isIncognito = await checkIncognito();
            if (isIncognito) return alert("Incognito mode এ এই টুলটি ব্যবহার করা যাবে না।");

            const targetPage = parseInt(targetPageInput.value);
            statusBox.classList.remove('hidden');
            downloadBtn.classList.add('hidden');
            statusMsg.innerText = `Connecting to Secure Engine...`;

            try {
                let b64Data = file.type === "application/pdf" ? await getPageAsB64(file, targetPage) : await new Promise(res => {
                    const r = new FileReader(); r.onload = () => res(r.result.split(',')[1]); r.readAsDataURL(file);
                });

                // Secure Server Engine Call
                const response = await fetch("/api/engine", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ 
                        imageB64: b64Data,
                        userInfo: { id: localStorage.getItem('arch_user_id'), isIncognito: false }
                    }) 
                });

                const data = await response.json();
                if (data.error) throw new Error(data.error);

                let rawHTML = data.choices[0].message.content.replace(/```html|```/g, "").trim();

                const finalContent = `
                    <html><head>
                    <script>window.MathJax = { tex: { inlineMath: [['$', '$']] } };<\/script>
                    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async><\/script>
                    <style>body { font-family: 'Times New Roman', serif; }</style>
                    </head><body><div id="main-content">${rawHTML}</div></body></html>
                `;

                document.getElementById('outputFrame').srcdoc = finalContent;
                
                // Analytics Increment
                let count = parseInt(localStorage.getItem('arch_page_counter')) + 1;
                localStorage.setItem('arch_page_counter', count);
                document.getElementById('displayCounter').innerText = count;

                statusMsg.innerText = "SUCCESSFULLY ARCHITECTED";
                downloadBtn.classList.remove('hidden');
            } catch (err) {
                console.error(err);
                statusMsg.innerText = "ENGINE ERROR";
                alert(err.message);
            }
        };

        // Docx Export Logic
        downloadBtn.onclick = function() {
            const frame = document.getElementById('outputFrame');
            const frameDoc = frame.contentDocument || frame.contentWindow.document;
            const contentHTML = frameDoc.getElementById('main-content')?.innerHTML || frameDoc.body.innerHTML;
            const fullDoc = `<!DOCTYPE html><html><head><meta charset="utf-8"></head><body>${contentHTML}</body></html>`;
            const converted = htmlDocx.asBlob(fullDoc);
            saveAs(converted, 'Docufai_Pro_Export.docx');
        };
    </script>
</body>
</html>
