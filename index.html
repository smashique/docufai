<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docufai - Professional AI Document Architect</title>
    
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#6366f1">
    <link rel="apple-touch-icon" href="/icon.svg">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/html-docx-js/dist/html-docx.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/file-saver/dist/FileSaver.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .spinner { border-top-color: #6366f1; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #outputFrame { width: 100%; height: 800px; border: none; background: #fff; }
        .preview-scroll::-webkit-scrollbar { height: 6px; }
        .preview-scroll::-webkit-scrollbar-thumb { background: #6366f1; border-radius: 10px; }
        .page-thumb.active { border: 4px solid #6366f1; background: #f5f3ff; transform: scale(0.95); }
        .drop-active { border-color: #6366f1 !important; background-color: #f0fdf4 !important; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">

    <nav class="bg-white border-b border-slate-200 px-8 py-4 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center space-x-2">
            <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-black shadow-lg text-xl">D</div>
            <span class="text-2xl font-black tracking-tighter text-slate-800 uppercase italic">Docufai <span class="text-indigo-600 text-[10px] lowercase font-bold tracking-[0.2em]">Pro</span></span>
        </div>
        
        <div class="flex items-center space-x-4">
            <button id="rechargeBtn" class="bg-gradient-to-r from-amber-500 to-orange-600 text-white px-4 py-2 rounded-xl text-[10px] font-black uppercase flex items-center space-x-2 hover:scale-95 transition-all shadow-lg hidden">
                <span>Unlock Credits</span>
                <span>⚡</span>
            </button>

            <div class="h-8 w-[1px] bg-slate-200"></div>
            <div class="text-right">
                <p class="text-[9px] text-slate-400 font-bold uppercase tracking-widest text-right">Credits</p>
                <p class="text-xs font-black text-emerald-600 tracking-tighter italic"><span id="remCredits">10</span> / <span id="totalCredits">10</span></p>
            </div>
            <div class="text-right">
                <p class="text-[9px] text-slate-400 font-bold uppercase tracking-widest text-right">Lifetime Pages</p>
                <p id="displayCounter" class="text-xs font-black text-slate-800 tracking-tighter">0</p>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-6 lg:p-10 grid grid-cols-1 lg:grid-cols-4 gap-8">
        <aside class="lg:col-span-1 space-y-6">
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                <h3 class="font-extrabold text-slate-800 mb-5 italic tracking-tight uppercase text-xs">📁 Secure Upload</h3>
                
                <div id="dropZone" class="border-2 border-dashed border-slate-300 rounded-2xl p-10 text-center cursor-pointer bg-slate-50 hover:border-indigo-500 transition-all relative">
                    <input type="file" id="fileInput" accept="image/*,application/pdf" class="hidden">
                    <div id="dropText">
                        <p class="text-[10px] text-slate-600 font-bold uppercase tracking-widest">Drop File Here or Click</p>
                    </div>
                </div>

                <div id="pageSelector" class="hidden mt-6 p-4 bg-indigo-50 rounded-2xl border border-indigo-100">
                    <div class="flex justify-between items-center mb-2">
                        <label class="text-[10px] font-bold text-indigo-600 uppercase">Target Page</label>
                        <span class="text-[10px] font-black text-indigo-400 uppercase">Total: <span id="totalPages">0</span></span>
                    </div>
                    <input type="number" id="targetPage" value="1" min="1" class="w-full px-4 py-2 rounded-xl border border-indigo-200 outline-none text-sm font-bold">
                </div>

                <div id="previewContainer" class="hidden mt-4">
                    <p class="text-[9px] font-bold text-slate-400 uppercase mb-2 italic">Select Page Preview</p>
                    <div id="previewScroll" class="preview-scroll flex space-x-2 overflow-x-auto pb-2"></div>
                </div>

                <button id="processBtn" class="w-full mt-8 bg-indigo-600 hover:bg-indigo-700 text-white font-black py-4 rounded-xl shadow-xl transition-all active:scale-95">CONVERT PAGE ⚡</button>
            </div>

            <div id="statusBox" class="hidden bg-white p-6 rounded-3xl border border-slate-200 shadow-sm text-center">
                <div class="spinner w-10 h-10 border-4 border-slate-200 mx-auto mb-4 rounded-full"></div>
                <p id="statusMsg" class="text-[10px] font-black text-slate-600 tracking-[0.2em] uppercase italic">Processing...</p>
            </div>
        </aside>

        <section class="lg:col-span-3">
            <div class="bg-slate-900 rounded-t-[2rem] px-6 py-4 flex items-center justify-between">
                <span class="text-slate-400 text-[10px] font-mono font-bold uppercase tracking-[0.3em]">Architect Terminal</span>
                <button id="downloadBtn" class="hidden bg-emerald-600 text-white text-[10px] font-bold px-4 py-1.5 rounded-lg transition-all hover:bg-emerald-700">Download .docx</button>
            </div>
            <div class="bg-white rounded-b-[2rem] shadow-2xl border border-slate-200 overflow-hidden min-h-[800px]">
                <iframe id="outputFrame" srcdoc="<body style='display:flex; justify-content:center; align-items:center; height:100vh; color:#94a3b8; font-family:sans-serif;'>আউটপুট এখানে আসবে...</body>"></iframe>
            </div>
        </section>
    </main>

    <canvas id="pdfCanvas" class="hidden"></canvas>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

        // PWA Setup
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => { navigator.serviceWorker.register('/sw.js'); });
        }

        if (!localStorage.getItem('doc_user_id')) {
            localStorage.setItem('doc_user_id', 'DOC-' + Math.random().toString(36).substr(2, 6).toUpperCase());
        }

        // DOM Elements
        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');
        const processBtn = document.getElementById('processBtn');
        const rechargeBtn = document.getElementById('rechargeBtn');
        const targetPageInput = document.getElementById('targetPage');
        const previewScroll = document.getElementById('previewScroll');
        const previewContainer = document.getElementById('previewContainer');
        const totalPagesSpan = document.getElementById('totalPages');

        // Drag & Drop
        dropZone.onclick = () => fileInput.click();
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => { e.preventDefault(); e.stopPropagation(); }, false);
        });
        dropZone.addEventListener('dragover', () => dropZone.classList.add('drop-active'));
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drop-active'));
        dropZone.addEventListener('drop', (e) => {
            dropZone.classList.remove('drop-active');
            if (e.dataTransfer.files.length) {
                fileInput.files = e.dataTransfer.files;
                handleFileSelect(e.dataTransfer.files[0]);
            }
        });
        fileInput.onchange = () => { if (fileInput.files[0]) handleFileSelect(fileInput.files[0]); };

        async function handleFileSelect(file) {
            document.getElementById('dropText').innerHTML = `<p class='text-[10px] text-indigo-600 font-black uppercase'>${file.name}</p>`;
            if (file && file.type === "application/pdf") {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
                totalPagesSpan.innerText = pdf.numPages;
                targetPageInput.max = pdf.numPages;
                document.getElementById('pageSelector').classList.remove('hidden');
                previewContainer.classList.remove('hidden');
                renderPreviews(pdf);
            } else {
                document.getElementById('pageSelector').classList.add('hidden');
                previewContainer.classList.add('hidden');
            }
        }

        async function renderPreviews(pdf) {
            previewScroll.innerHTML = '';
            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const viewport = page.getViewport({ scale: 0.3 });
                const canvas = document.createElement('canvas');
                canvas.className = `page-thumb shrink-0 border-2 border-transparent rounded-lg cursor-pointer transition-all`;
                canvas.onclick = () => {
                    targetPageInput.value = i;
                    document.querySelectorAll('.page-thumb').forEach(el => el.classList.remove('active'));
                    canvas.classList.add('active');
                };
                const context = canvas.getContext('2d');
                canvas.height = viewport.height; canvas.width = viewport.width;
                await page.render({ canvasContext: context, viewport: viewport }).promise;
                previewScroll.appendChild(canvas);
            }
        }

        async function getPageAsB64(file, pageNum) {
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
            const page = await pdf.getPage(pageNum);
            const canvas = document.getElementById('pdfCanvas');
            const context = canvas.getContext('2d');
            const viewport = page.getViewport({ scale: 2 });
            canvas.height = viewport.height; canvas.width = viewport.width;
            await page.render({ canvasContext: context, viewport: viewport }).promise;
            return canvas.toDataURL('image/png').split(',')[1];
        }

        // PROCESS FUNCTION
        processBtn.onclick = async () => {
            const file = fileInput.files[0];
            if (!file) return alert("ফাইল সিলেক্ট করুন!");
            document.getElementById('statusBox').classList.remove('hidden');
            document.getElementById('statusMsg').innerText = "Analyzing Page Geometry...";

            try {
                let b64Data = file.type === "application/pdf" ? await getPageAsB64(file, parseInt(targetPageInput.value)) : await new Promise(res => {
                    const r = new FileReader(); r.onload = () => res(r.result.split(',')[1]); r.readAsDataURL(file);
                });

                const response = await fetch("/api/engine", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ imageB64: b64Data, userInfo: { id: localStorage.getItem('doc_user_id') } })
                });

                const data = await response.json();

                if (response.status === 402) {
                    rechargeBtn.classList.remove('hidden');
                    alert("আপনার ক্রেডিট শেষ! Unlock Credits বাটনে ক্লিক করুন।");
                    document.getElementById('statusBox').classList.add('hidden');
                    return;
                }

                let aiContent = data.choices[0].message.content.replace(/```html|```/g, "").trim();

                // 1. EXTRACT HEADER/FOOTER
                let headerContent = "";
                let footerContent = "";
                let bodyContent = aiContent;

                const headerMatch = aiContent.match(/<header>(.*?)<\/header>/s);
                if (headerMatch) {
                    headerContent = headerMatch[1];
                    bodyContent = bodyContent.replace(headerMatch[0], "");
                }
                const footerMatch = aiContent.match(/<footer>(.*?)<\/footer>/s);
                if (footerMatch) {
                    footerContent = footerMatch[1];
                    bodyContent = bodyContent.replace(footerMatch[0], "");
                }

                // 2. MS WORD XML TEMPLATE
                const wordHTML = `
                    <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
                    <head>
                        <meta charset="utf-8">
                        <title>Docufai Replica</title>
                        <script>
                            window.MathJax = { tex: { inlineMath: [['$', '$']] }, svg: { fontCache: 'global' } };
                        <\/script>
                        <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async><\/script>
                        
                        <xml>
                            <w:WordDocument>
                                <w:View>Print</w:View>
                                <w:Zoom>100</w:Zoom>
                            </w:WordDocument>
                        </xml>

                        <style>
                            @page {
                                size: 21cm 29.7cm;
                                margin: 1.27cm 1.27cm 1.27cm 1.27cm;
                                mso-page-orientation: portrait;
                                mso-header: url("docufai_header.htm") h1;
                                mso-footer: url("docufai_footer.htm") f1;
                            }
                            @page Section1 {
                                size: 21cm 29.7cm;
                                margin: 1.27cm 1.27cm 1.27cm 1.27cm;
                                mso-header-margin: 0.5in;
                                mso-footer-margin: 0.5in;
                                mso-header: h1;
                                mso-footer: f1;
                            }
                            div.Section1 { page: Section1; }
                            
                            body { font-family: 'Times New Roman', serif; font-size: 11pt; line-height: 1.15; }
                            table { border-collapse: collapse; width: 100%; table-layout: fixed; border: 1px solid #000; }
                            td { border: 1px solid #000; padding: 5pt; vertical-align: top; word-wrap: break-word; }
                            
                            div#h1 { margin: 0; padding: 0; font-size: 9pt; text-align: center; border-bottom: 1px solid #ddd; }
                            div#f1 { margin: 0; padding: 0; font-size: 9pt; text-align: center; border-top: 1px solid #ddd; }
                        </style>
                    </head>
                    <body>
                        <div class="Section1">
                            <div style='mso-element:header' id=h1>${headerContent || '<p>Docufai Header</p>'}</div>
                            ${bodyContent}
                            <div style='mso-element:footer' id=f1>${footerContent || '<p>Page <span style="mso-field-code: PAGE "></span> of <span style="mso-field-code: NUMPAGES "></span></p>'}</div>
                        </div>
                    </body>
                    </html>
                `;

                document.getElementById('outputFrame').srcdoc = wordHTML;
                document.getElementById('remCredits').innerText = data.total_credits - data.updated_count;
                document.getElementById('totalCredits').innerText = data.total_credits;
                document.getElementById('displayCounter').innerText = data.updated_count;
                
                if ((data.total_credits - data.updated_count) <= 0) rechargeBtn.classList.remove('hidden');
                document.getElementById('downloadBtn').classList.remove('hidden');
                document.getElementById('statusBox').classList.add('hidden');

            } catch (err) {
                alert("Error: " + err.message);
                document.getElementById('statusBox').classList.add('hidden');
            }
        };

        rechargeBtn.onclick = () => window.location.href = "/api/pay?userId=" + localStorage.getItem('doc_user_id');
        
        document.getElementById('downloadBtn').onclick = function() {
            const frame = document.getElementById('outputFrame');
            const content = frame.contentDocument.documentElement.outerHTML;
            const blob = new Blob(['\ufeff', content], { type: 'application/msword' });
            saveAs(blob, 'Docufai_Replica.doc');
        };
    </script>
</body>
</html>
