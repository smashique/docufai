<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docufai Pro - Elite AI Document Architect</title>
    
    <link rel="manifest" href="/manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/file-saver/dist/FileSaver.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Hind+Siliguri:wght@400;700&display=swap');
        body { font-family: 'Inter', 'Hind Siliguri', sans-serif; }
        .progress-line { height: 4px; width: 0%; background: linear-gradient(to right, #6366f1, #a855f7); transition: width 0.4s ease; }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.3); }
        .page-thumb.active { border: 4px solid #6366f1; transform: scale(0.95); }
    </style>
</head>
<body class="bg-[#f8fafc]">

    <div class="fixed top-0 left-0 w-full z-[100]"><div id="topProgress" class="progress-line"></div></div>

    <nav class="glass sticky top-0 z-50 px-8 py-4 flex justify-between items-center shadow-sm">
        <div class="flex items-center space-x-3">
            <div class="w-11 h-11 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-black shadow-xl text-xl rotate-3">D</div>
            <span class="text-2xl font-black tracking-tighter text-slate-800 uppercase italic">Docufai <span class="text-indigo-600 text-[10px] lowercase block -mt-2 font-bold">Pro</span></span>
        </div>
        <div class="flex items-center space-x-4">
            <div class="text-right"><p id="remCredits" class="text-lg font-black text-indigo-600 italic">10</p></div>
            <button id="rechargeBtn" class="bg-indigo-600 text-white px-6 py-2 rounded-xl text-[10px] font-black uppercase tracking-wider">Recharge ⚡</button>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
        <aside class="lg:col-span-4 space-y-6">
            <div class="bg-white p-8 rounded-[2rem] shadow-xl border border-slate-100">
                <div id="dropZone" class="border-2 border-dashed border-slate-200 rounded-[1.5rem] p-10 text-center cursor-pointer hover:border-indigo-400 transition-all">
                    <input type="file" id="fileInput" accept="image/*,application/pdf" class="hidden">
                    <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Drop File Here</p>
                </div>
                <div id="previewContainer" class="hidden mt-6 overflow-x-auto flex space-x-2 pb-2"></div>
                <button id="processBtn" class="w-full mt-6 bg-indigo-600 text-white font-black py-4 rounded-xl shadow-xl transition-all">ARCHITECT NOW ⚡</button>
            </div>
            <div id="statusBox" class="hidden bg-white p-6 rounded-2xl text-center shadow-md">
                <div class="w-8 h-8 border-t-2 border-indigo-600 rounded-full animate-spin mx-auto mb-2"></div>
                <p class="text-[10px] font-black uppercase tracking-widest">Engineering Layout...</p>
            </div>
        </aside>

        <section class="lg:col-span-8">
            <div class="bg-slate-900 rounded-t-[2rem] px-8 py-4 flex justify-between items-center shadow-2xl">
                <span class="text-slate-500 text-[10px] font-mono font-bold">TERMINAL V2.0</span>
                <div class="flex space-x-2">
                    <button id="copyBtn" class="hidden bg-slate-700 text-white text-[9px] px-4 py-1.5 rounded-lg">COPY HTML</button>
                    <button id="downloadBtn" class="hidden bg-emerald-500 text-white text-[9px] px-4 py-1.5 rounded-lg">DOWNLOAD .DOCX</button>
                </div>
            </div>
            <div class="bg-white rounded-b-[2rem] shadow-2xl min-h-[700px] relative">
                <iframe id="outputFrame" class="hidden w-full h-[700px] rounded-b-[2rem]"></iframe>
            </div>
        </section>
    </main>

    <canvas id="pdfCanvas" class="hidden"></canvas>

    <script type="module">
        import { sharpenForAI, getEliteWordTemplate } from './api/formats.js'; // মডুলার ইমপোর্ট

        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
        const state = { userId: localStorage.getItem('doc_user_id') || 'DOC-' + Math.random().toString(36).substr(2, 6).toUpperCase() };
        localStorage.setItem('doc_user_id', state.userId);

        const fileInput = document.getElementById('fileInput');
        const outFrame = document.getElementById('outputFrame');

        // ইমেজ শার্পেনিং ও বি৬৪ হ্যান্ডলিং
        async function getProcessedB64(canvas) {
            sharpenForAI(canvas); 
            return canvas.toDataURL('image/png').split(',')[1];
        }

        processBtn.onclick = async () => {
            const file = fileInput.files[0];
            if (!file) return alert("Select file!");
            if (navigator.vibrate) navigator.vibrate(50); // হ্যাপটিক ফিডব্যাক

            document.getElementById('statusBox').classList.remove('hidden');
            document.getElementById('topProgress').style.width = "40%";

            try {
                // ফাইল প্রসেসিং লজিক
                const canvas = document.getElementById('pdfCanvas');
                let b64Data;
                
                if (file.type === "application/pdf") {
                    const pdf = await pdfjsLib.getDocument(await file.arrayBuffer()).promise;
                    const page = await pdf.getPage(1);
                    const viewport = page.getViewport({ scale: 2 });
                    canvas.width = viewport.width; canvas.height = viewport.height;
                    await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
                    b64Data = await getProcessedB64(canvas);
                } else {
                    const img = new Image(); img.src = URL.createObjectURL(file);
                    await new Promise(r => img.onload = r);
                    canvas.width = img.width; canvas.height = img.height;
                    canvas.getContext('2d').drawImage(img, 0, 0);
                    b64Data = await getProcessedB64(canvas);
                }

                const response = await fetch("/api/engine", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ imageB64: b64Data, userInfo: { id: state.userId } })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error);

                // ফর্মেটিং ইঞ্জিন কল করা
                let aiContent = data.choices[0].message.content.replace(/```html|```/g, "").trim();
                outFrame.classList.remove('hidden');
                outFrame.srcdoc = getEliteWordTemplate(aiContent);

                // এডিটর এনাবল করা
                outFrame.onload = () => outFrame.contentDocument.body.contentEditable = 'true';

                document.getElementById('downloadBtn').classList.remove('hidden');
                document.getElementById('copyBtn').classList.remove('hidden');
                document.getElementById('topProgress').style.width = "100%";
                document.getElementById('statusBox').classList.add('hidden');

            } catch (err) { alert(err.message); }
        };

        downloadBtn.onclick = () => {
            const blob = new Blob(['\ufeff', outFrame.contentDocument.documentElement.outerHTML], { type: 'application/msword' });
            saveAs(blob, 'Docufai_Export.doc');
        };
    </script>
</body>
</html>
